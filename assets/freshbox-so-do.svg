<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">FreshBox — khung theo dõi thực phẩm trong tủ lạnh</title>
  <desc id="desc">Sơ đồ concept khung mở bốn bên, pin dự kiến trong bốn trụ, chiều ngang 26, 38 hoặc 50 cm và chiều cao điều chỉnh. Cảm biến ghi sự kiện, người dùng xác nhận và nhận nhắc kiểm tra. Chưa phải bản vẽ chế tạo.</desc>
  <defs>
    <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#d9e3df"/><stop offset=".5" stop-color="#f7faf8"/><stop offset="1" stop-color="#a8bdb2"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#398168"/></marker>
  </defs>
  <rect width="1200" height="820" rx="28" fill="#f2f6f3"/>
  <rect x="32" y="32" width="1136" height="125" rx="22" fill="#163f32"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="62" y="90" font-size="42" font-weight="700" fill="#fff">FreshBox</text>
    <text x="62" y="127" font-size="21" fill="#d7e9df">Ghi nhận sự kiện · Xác nhận thông tin · Nhắc kiểm tra</text>
    <rect x="888" y="60" width="244" height="38" rx="19" fill="#2b5645"/>
    <text x="1010" y="85" text-anchor="middle" font-size="16" fill="#e1f1e8">CONCEPT CỦA NHÓM</text>
    <rect x="32" y="181" width="656" height="455" rx="22" fill="#fff" stroke="#dce7df"/>
    <text x="60" y="220" font-size="21" font-weight="600" fill="#214435">Khung mở bốn bên</text>
    <g transform="translate(20 5)">
      <polygon points="120,507 230,442 545,442 435,507" fill="#d6e2da"/>
      <path d="M230 253V442 M545 253V442" stroke="#a2b6ab" stroke-width="23" stroke-linecap="round"/>
      <path d="M230 313V375 M545 313V375" stroke="#398168" stroke-width="14"/>
      <rect x="248" y="368" width="162" height="86" rx="15" fill="#d8ead7" stroke="#84a889" stroke-width="2"/>
      <rect x="239" y="357" width="180" height="22" rx="10" fill="#a6c4a4"/>
      <rect x="275" y="394" width="104" height="35" rx="8" fill="#fff"/>
      <text x="327" y="418" text-anchor="middle" font-size="19" fill="#315641">Hộp A</text>
      <path d="M120 318V507 M435 318V507" stroke="url(#metal)" stroke-width="26" stroke-linecap="round"/>
      <path d="M120 383V445 M435 383V445" stroke="#398168" stroke-width="15"/>
      <polygon points="120,318 230,253 545,253 435,318" fill="#c7d7cc" stroke="#9ab0a1" stroke-width="2"/>
      <path d="M120 318H435 M435 318L545 253" stroke="#eef3ef" stroke-width="22" stroke-linejoin="round"/>
      <rect x="269" y="305" width="132" height="27" rx="5" fill="#224837"/>
      <text x="335" y="324" text-anchor="middle" font-size="13" fill="#fff">GHI NHẬN SỰ KIỆN</text>
      <path d="M120 507H435 M435 507L545 442" stroke="#a6bdb0" stroke-width="23" stroke-linejoin="round"/>
      <circle cx="230" cy="289" r="15" fill="#163f32"/><circle cx="545" cy="289" r="15" fill="#163f32"/>
      <circle cx="120" cy="353" r="15" fill="#163f32"/><circle cx="435" cy="353" r="15" fill="#163f32"/>
      <g font-size="14" text-anchor="middle" fill="#fff"><text x="230" y="294">1</text><text x="545" y="294">2</text><text x="120" y="358">3</text><text x="435" y="358">4</text></g>
      <path d="M82 481V345" stroke="#398168" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="56" y="431" transform="rotate(-90 56 431)" font-size="15" fill="#3c6952">Cao điều chỉnh</text>
    </g>
    <text x="360" y="558" text-anchor="middle" font-size="18" fill="#315641">Ngang minh họa: 26 / 38 / 50 cm</text>
    <text x="360" y="588" text-anchor="middle" font-size="16" fill="#63796c">Bốn trụ góc: vị trí pin dự kiến</text>
    <text x="360" y="615" text-anchor="middle" font-size="15" fill="#63796c">MVP: một vật phẩm trong một vùng theo dõi</text>
    <rect x="712" y="181" width="456" height="455" rx="22" fill="#e4eee7"/>
    <rect x="776" y="208" width="328" height="396" rx="31" fill="#193c2e"/>
    <rect x="790" y="225" width="300" height="362" rx="22" fill="#f8fbf8"/>
    <rect x="886" y="234" width="108" height="7" rx="3.5" fill="#bdd0c2"/>
    <text x="813" y="282" font-size="25" font-weight="700" fill="#1c4733">FreshBox</text>
    <text x="813" y="309" font-size="15" fill="#607767">Ví dụ màn hình — chưa phải app</text>
    <rect x="807" y="333" width="266" height="96" rx="12" fill="#e4efe5"/>
    <text x="823" y="361" font-size="19" font-weight="600" fill="#254b34">Hộp A</text>
    <text x="823" y="389" font-size="16" fill="#315641">Mốc cất: đã xác nhận</text>
    <text x="823" y="413" font-size="16" fill="#617768">Ngày mở: chưa rõ</text>
    <rect x="807" y="444" width="266" height="65" rx="12" fill="#fff0cd"/>
    <text x="823" y="471" font-size="17" font-weight="600" fill="#7a5b23">Đến mốc kiểm tra đã chọn</text>
    <text x="823" y="494" font-size="14" fill="#7a5b23">Xem nhãn và lịch sử bảo quản</text>
    <rect x="807" y="525" width="126" height="40" rx="10" fill="#2f7354"/>
    <text x="870" y="550" text-anchor="middle" font-size="16" fill="#fff">Xác nhận</text>
    <rect x="947" y="525" width="126" height="40" rx="10" fill="#e1eae3"/>
    <text x="1010" y="550" text-anchor="middle" font-size="16" fill="#315641">Sửa thông tin</text>
    <g fill="#fff" stroke="#dce7df">
      <rect x="32" y="660" width="264" height="70" rx="15"/>
      <rect x="322" y="660" width="264" height="70" rx="15"/>
      <rect x="612" y="660" width="264" height="70" rx="15"/>
      <rect x="902" y="660" width="266" height="70" rx="15"/>
    </g>
    <g font-size="18" text-anchor="middle" fill="#315641"><text x="164" y="702">1. Cảm biến ghi sự kiện</text><text x="454" y="702">2. Người dùng xác nhận</text><text x="744" y="702">3. Rule lưu và nhắc</text><text x="1035" y="702">4. Cập nhật trạng thái</text></g>
    <text x="600" y="771" text-anchor="middle" font-size="17" fill="#526d5b">Theo dõi thời gian không xác nhận thực phẩm an toàn để ăn.</text>
    <text x="600" y="799" text-anchor="middle" font-size="14" fill="#6a8071">Sơ đồ diễn giải từ tư liệu nhóm · Không theo tỷ lệ · Chưa phải thiết kế chế tạo</text>
  </g>
</svg>
